# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
#     desired widget in your `content/home/` folder.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: Home
    url: /
    weight: 10
  - name: About
    url: /#about
    weight: 20
  - name: Education
    url: /#education
    weight: 30
  - name: Experience
    url: /#experience
    weight: 40
  - name: Projects
    url: /#projects
    weight: 50
  - name: Blog
    url: /blog/
    weight: 60
  - name: Awards
    url: /#awards
    weight: 70
